<html>
    <head>
        <meta charset="utf-8"/>
        <title>TEI Publisher API Documentation</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@4.18.1/swagger-ui.min.css"/>
        <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@4.18.1/swagger-ui-bundle.min.js" charset="UTF-8"/>
    </head>
    <body>
        <div id="swagger"/>
        <div id="custom"/>
        
        <div id="iiif"/>
         
        <div id="rview"/>
         
        <div id="timeline"/>
         
        <div id="sitemap"/>
         
        <div id="anno"/>
        
        <script>
            // Les specs OpenAPI contiennent un `servers[].url` codé en dur
            // ("/exist/apps/GdSiecle"). Servies statiquement par le controller,
            // elles ne sont pas patchées côté serveur. On dérive donc le préfixe
            // réel du chemin où cette page est chargée (api.html), pour que
            // « Try it out » tape la bonne URL quel que soit le déploiement :
            // URL classique /exist/apps/GdSiecle OU reverse-proxy /grand-siecle.
            const deployPrefix =
                window.location.pathname.replace(/\/api\.html\/?$/, "") || "";

            function mountSpec(url, dom_id) {
                fetch(url, { credentials: "include" })
                    .then(function(r) { return r.json(); })
                    .then(function(spec) {
                        // Aligne le serveur sur le préfixe de déploiement courant
                        spec.servers = [{
                            url: deployPrefix,
                            description: "Déploiement courant"
                        }];
                        SwaggerUIBundle({
                            spec: spec,
                            dom_id: dom_id,
                            displayOperationId: true,
                            displayRequestDuration: true,
                            showExtensions: true,
                            withCredentials: true
                        });
                    });
            }

            window.onload = function() {
                mountSpec("modules/lib/api.json", "#swagger");
                mountSpec("modules/iiif-api.json", "#iiif");
                mountSpec("modules/registers-api.json", "#rview");
                mountSpec("modules/timeline-api.json", "#timeline");
                mountSpec("modules/sitemap-api.json", "#sitemap");
                mountSpec("modules/annotations/api.json", "#anno");
            }
        </script>
    </body>
</html>
