<template>
    ---json
    {
        "templating": {
            "extends": "templates/layouts/content.html"
        },
        "styles": [
            "resources/css/grand-siecle.css",
            "transform/grand_siecle.css"
        ],
        "script": {
            "custom": [
                "resources/scripts/toc.js",
                "resources/scripts/ner-slider.js",
                "resources/scripts/lang-toggle.js",
                "resources/scripts/entity-panel.js"
            ]
        },
        "features": {
            "toolbar": {
                "enabled": true
            }
        }
    }
    ---

    [% template toolbar %]
    <li class="gs-toolbar">
        <!-- Orig/Reg toggle -->
        <pb-toggle-feature name="mode" default="off"
            emit="transcription" subscribe="transcription">
            <pb-i18n key="document.modernized">Modernized</pb-i18n>
        </pb-toggle-feature>

        <!-- NER confidence slider -->
        <div class="ner-slider-container">
            <label for="ner-threshold">
                <pb-i18n key="document.ner-threshold">NER</pb-i18n>
            </label>
            <input type="range" id="ner-threshold" min="0" max="1" step="0.05" value="0.5"/>
            <span id="ner-threshold-value">0.50</span>
        </div>

        <!-- Language highlight toggles (buttons generated dynamically from page content) -->
        <div class="lang-toggle-container">
            <label><pb-i18n key="document.languages">Langues</pb-i18n></label>
            <span class="lang-toggle-buttons"></span>
        </div>
    </li>
    [% endtemplate %]

    [% block content %]
    <div class="gs-doc-layout">
        <div class="center">
            <pb-view src="document1" view="page"
                column-separator=".tei-cb"
                append-footnotes="append-footnotes"
                subscribe="transcription" emit="transcription"
                animation=""
                direction="[[$context?defaults?direction]]"/>
        </div>

        <!-- Entity panel (collapsible sidebar) -->
        <aside class="gs-entity-panel" id="entity-panel">
            <button class="gs-entity-panel-toggle" id="entity-panel-toggle"
                title="Entites">&#9776;</button>
            <div class="gs-entity-panel-content" id="entity-panel-content">
                <h3>Entites detectees</h3>
                <div class="gs-entity-summary" id="entity-summary"></div>
                <div class="gs-entity-filters" id="entity-filters"></div>
                <div class="gs-entity-list" id="entity-list"></div>
            </div>
        </aside>
    </div>

    <div class="page-navigation">
        <pb-navigation direction="backward" unit="page"
            subscribe="transcription" emit="transcription">
            <pb-i18n key="navigation.prev">Previous</pb-i18n>
        </pb-navigation>
        <pb-navigation direction="forward" unit="page"
            subscribe="transcription" emit="transcription">
            <pb-i18n key="navigation.next">Next</pb-i18n>
        </pb-navigation>
    </div>
    [% endblock %]
</template>
