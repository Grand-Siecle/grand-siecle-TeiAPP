<template>
    ---json
    {
        "templating": {
            "extends": "templates/layouts/content.html"
        },
        "styles": [
            "resources/css/grand-siecle.css",
            "resources/css/document-view.css",
            "resources/css/entity-aside.css",
            "transform/grand_siecle.css"
        ],
        "script": {
            "custom": [
                "resources/scripts/ner-slider.js",
                "resources/scripts/lang-toggle.js",
                "resources/scripts/entity-panel.js",
                "resources/scripts/gs-facs-detect.js"
            ]
        },
        "features": {
            "toolbar": { "enabled": true },
            "metadata": { "enabled": false },
            "iiif": { "enabled": false }
        }
    }
    ---

    [% template breadcrumb %]
    [% if exists($context?doc) %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                [[ page:collection-breadcrumbs($context) ]]
                <li>[[ page:transform($context?doc?content, map { "mode": "breadcrumb" }, $context?doc?odd || ".odd") ]]</li>
            </ul>
        </nav>
    </li>
    <li>
        <pb-grid-action action="add" class="grid-add" grid="#grid">
            <button class="accent">
                <svg xmlns="http://www.w3.org/2000/svg" class="ionicon" viewBox="0 0 512 512">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32" d="M256 112v288M400 256H112"/>
                </svg>
                <span><pb-i18n key="document.add-panel">Ajouter une vue</pb-i18n></span>
            </button>
        </pb-grid-action>
    </li>
    [% endif %]
    [% endtemplate %]

    [% template content-top %]
    <div class="gs-page-toolbar">
        <div class="ner-slider-container">
            <label for="ner-threshold">
                <pb-i18n key="document.ner-threshold">Seuil NER</pb-i18n>
            </label>
            <input type="range" id="ner-threshold" min="0" max="1" step="0.05" value="0.5"/>
            <span id="ner-threshold-value">0.50</span>
        </div>
        <div class="lang-toggle-container">
            <label><pb-i18n key="document.languages">Langues</pb-i18n></label>
            <span class="lang-toggle-buttons"></span>
        </div>
    </div>
    [% endtemplate %]

    [% template after %]
    <h5 class="gs-metadata-heading">
        <pb-i18n key="document.metadata-title">Métadonnées du document</pb-i18n>
    </h5>
    <pb-view src="document1" xpath="//teiHeader" view="single"
             class="metadata gs-metadata-aside"
             load-css="resources/css/metadata-aside.css"
             subscribe="transcription" emit="transcription">
        <pb-param name="view" value="metadata"/>
    </pb-view>
    [% endtemplate %]

    <pb-grid id="grid" panels="[0]" direction="ltr" subscribe="transcription" emit="transcription">

        <!-- Single prototype: pb-grid clones it once on initial load (panels="[0]"),
             and again each time the user clicks "Ajouter une vue".
             Each cloned panel has a dropdown to switch between Original / Modernisé /
             Fac-similé / Notes. The first panel emits transcription events;
             additional panels only subscribe (handled by pb-grid auto-management). -->
        <template>
            <pb-panel emit="transcription" class="gs-panel">
                <li slot="toolbar">
                    <pb-grid-action grid="#grid" action="remove">
                        <button class="light" title="Fermer ce panneau">
                            <svg xmlns="http://www.w3.org/2000/svg" class="ionicon" viewBox="0 0 512 512">
                                <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32" d="M368 368L144 144M368 144L144 368"/>
                            </svg>
                        </button>
                    </pb-grid-action>
                </li>
                <li slot="toolbar">
                    <button class="gs-entity-aside-toggle light" type="button"
                            title="Afficher / masquer les entités">
                        <svg xmlns="http://www.w3.org/2000/svg" class="ionicon" viewBox="0 0 512 512">
                            <circle cx="256" cy="256" r="32" fill="currentColor"/>
                            <circle cx="416" cy="256" r="32" fill="currentColor"/>
                            <circle cx="96" cy="256" r="32" fill="currentColor"/>
                        </svg>
                    </button>
                </li>
                <template title="Original">
                    <pb-view src="document1" view="page"
                             column-separator=".tei-cb"
                             append-footnotes="append-footnotes"
                             subscribe="transcription" emit="transcription"
                             class="gs-panel-original"/>
                </template>
                <template title="Modernisé">
                    <pb-view src="document1" view="page"
                             column-separator=".tei-cb"
                             append-footnotes="append-footnotes"
                             subscribe="transcription" emit="transcription"
                             class="gs-panel-modernized"/>
                </template>
                <template title="Fac-similé">
                    <pb-facsimile subscribe="transcription" type="iiif"
                                  show-navigation-control="show-navigation-control"
                                  show-navigator="show-navigator"
                                  default-zoom-level="0"
                                  style="height: 100%"/>
                </template>
                <template title="Notes">
                    <pb-view src="document1" view="page"
                             load-css="resources/css/notes-panel.css"
                             subscribe="transcription" emit="transcription"
                             class="gs-panel-notes">
                        <pb-param name="view" value="notes"/>
                    </pb-view>
                </template>
            </pb-panel>
        </template>
    </pb-grid>
</template>
