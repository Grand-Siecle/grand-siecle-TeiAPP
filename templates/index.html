<template>
    ---json
    {
        "templating": {
            "extends": "templates/layouts/base.html"
        },
        "features": {
            "toolbar": {
                "enabled": false
            }
        },
        "styles": [
            "resources/css/landing-page.css", "resources/css/grand-siecle.css", "transform/teipublisher.css"
        ],
        "script": {
            "custom": [
                "resources/scripts/language.js",
                "resources/scripts/landing.js"
            ]
        },
        "theme": {
            "layout": {
                "class": "landing-layout"
            }
        }
    }
    ---

    [% template styles %]
    [% endtemplate %]

    [% template hero %]
    <header class="gs-hero">
        <div class="gs-hero-inner">
            <div class="gs-hero-content">
                <span class="gs-hero-kicker">XVI<sup>e</sup>–XVII<sup>e</sup> siècle</span>
                <h1 class="gs-hero-title">
                    <span class="gs-hero-title-grand">Grand</span>
                    <span class="gs-hero-title-siecle">Siècle</span>
                </h1>
                <p class="gs-hero-subtitle">Qu'est-ce qu'une bonne peinture ? Qu'est-ce qui fait le peintre ? Pour la première fois, on en débat en français.</p>
                <div class="gs-hero-cta">
                    <a href="browse.html" class="gs-btn gs-btn-primary">Explorer le corpus</a>
                    <a href="#about" class="gs-btn gs-btn-ghost">Découvrir le projet</a>
                </div>
                <div class="gs-hero-stats">
                    <div class="gs-stat">
                        <span class="gs-stat-number">300+</span>
                        <span class="gs-stat-label">sources</span>
                    </div>
                    <div class="gs-stat">
                        <span class="gs-stat-number">3</span>
                        <span class="gs-stat-label">langues</span>
                    </div>
                    <div class="gs-stat">
                        <span class="gs-stat-number">1590</span>
                        <span class="gs-stat-label">— 1650</span>
                    </div>
                </div>
            </div>
            <div class="gs-hero-visual">
                <div class="gs-hero-frame">
                    <img src="resources/images/image-front_1.jpg" alt="" class="gs-hero-painting"/>
                    <div class="gs-hero-frame-border"></div>
                </div>
            </div>
        </div>
        <a href="#about" class="gs-hero-scroll-hint">
            <span>Défiler</span>
            <svg width="16" height="24" viewBox="0 0 16 24" fill="none"><path d="M8 4V20M8 20L2 14M8 20L14 14" stroke="currentColor" stroke-width="1.5"/></svg>
        </a>
    </header>
    [% endtemplate %]

    <!-- ABOUT -->
    <section id="about" class="gs-section gs-section-about gs-reveal">
        <div class="gs-section-inner">
            <div class="gs-section-marker">I</div>
            <div class="gs-section-body">
                [[ landing:section($context, 'about', $landing?content, 'landing.odd') ]]
            </div>
        </div>
    </section>

    <!-- HIGHLIGHTS -->
    <section id="highlights" class="gs-section gs-section-explore gs-reveal">
        <div class="gs-section-inner">
            <div class="gs-section-marker">II</div>
            <div class="gs-section-body">
                [[ landing:section($context, 'highlights', $landing?content, 'landing.odd') ]]
            </div>
        </div>
    </section>

    <!-- AXES DE RECHERCHE -->
    <section id="axes" class="gs-section gs-section-axes gs-reveal">
        <div class="gs-section-inner">
            <div class="gs-section-marker">III</div>
            <div class="gs-section-body">
                [[ landing:section($context, 'section', $landing?content, 'landing.odd') ]]
            </div>
        </div>
    </section>

    <!-- EQUIPE -->
    <section id="team" class="gs-section gs-section-team gs-reveal">
        <div class="gs-section-inner">
            <div class="gs-section-marker">IV</div>
            <div class="gs-section-body">
                [[ landing:section($context, 'team', $landing?content, 'landing.odd') ]]
            </div>
        </div>
    </section>

    <!-- PARTENAIRES (default TEI Publisher layout) -->
    <section id="project-partners" class="section-light">
        [[ landing:section($context, 'partners', $landing?content, 'landing.odd') ]]
    </section>

    [% include "templates/bottom.html" %]
    [% include "templates/footer.html" %]
</template>
